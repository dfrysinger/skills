          printf '%s  host-cli/copilot\n' \
            "$COPILOT_LINUX_BINARY_SHA256" \
            | sha256sum --check --strict
          printf '%s\n' "$GITHUB_WORKSPACE/host-cli" >> "$GITHUB_PATH"
      - name: Configure exact Linux grading image
        if: matrix.imageAsset != ''
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          settings = json.loads(path.read_text()) if path.exists() else {}
          settings.setdefault("features", {})["containerd-snapshotter"] = True
          path.write_text(json.dumps(settings) + "\n")
          PY
          sudo systemctl restart docker
          python3 -B skills/skill-evaluation/scripts/distributed_campaign.py download-release \
            --repository "$GITHUB_REPOSITORY" \
            --release "${{ matrix.imageRelease }}" \
            --asset "${{ matrix.imageAsset }}" \
            --destination "downloads/images/${{ matrix.imageAsset }}"
          python3 -B skills/skill-evaluation/scripts/distributed_campaign.py verify-image \
            --manifest "$IMAGE_MANIFEST_PATH" \
            --release "${{ matrix.imageRelease }}" --image-id "${{ matrix.imageId }}" \
            --asset "${{ matrix.imageAsset }}" \
            --archive "downloads/images/${{ matrix.imageAsset }}"
          sudo docker load --input "downloads/images/${{ matrix.imageAsset }}"
          python3 -B skills/skill-evaluation/scripts/distributed_campaign.py verify-loaded-image \
            --image-id "${{ matrix.imageId }}"
      - name: Run complete Linux attempt
        id: execution
        env:
          COPILOT_EVAL_MODEL_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          test -n "$COPILOT_EVAL_MODEL_TOKEN"
          python3 -B skills/skill-evaluation/scripts/distributed_campaign.py run-hosted \
            --package-root inputs \
            --attempt-id "${{ matrix.attemptId }}" \
            --case-id "${{ matrix.caseId }}" \
            --case-revision "${{ matrix.caseRevision }}" \
            --treatment-id "${{ matrix.treatmentId }}" \
            --repetition "${{ matrix.repetition }}" \
            --run-root run-root > evidence/execution.log 2>&1
      - name: Preserve complete Linux evidence
        if: always()
        run: |
          set -euo pipefail
          python3 -B skills/skill-evaluation/scripts/distributed_campaign.py retain \
