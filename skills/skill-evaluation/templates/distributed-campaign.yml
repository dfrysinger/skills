          printf '%s  host-cli/copilot\n' \
            "$COPILOT_LINUX_BINARY_SHA256" \
            | sha256sum --check --strict
          printf '%s\n' "$GITHUB_WORKSPACE/host-cli" >> "$GITHUB_PATH"
      - name: Configure exact Linux grading image
